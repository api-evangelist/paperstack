aid: paperstack
name: Paperstack
description: >-
  Paperstack is a Canadian fintech operating a private-credit / working-capital
  financing platform for direct-to-consumer (DTC), e-commerce, and retail
  consumer brands. It provides non-dilutive, revenue-based funding of up to
  $5,000,000 that brands can use without restrictions to purchase inventory,
  invest in advertising, and finance payroll, with transparent flat fees
  (typically 4-10%) and no origination or late fees. Paperstack couples a
  network of lending partners with proprietary AI/ML underwriting software that
  integrates directly into a brand's financial and e-commerce data to assess
  creditworthiness and project future performance in real time. Founded by Assel
  Beglinova (CEO) and Vadim Lidich (CTO) and backed by Techstars, the company has
  processed over 1,500 funding applications. As of this enrichment pass
  Paperstack publishes a customer-facing product and marketing site only; it
  exposes no public developer API, SDKs, or developer documentation.
